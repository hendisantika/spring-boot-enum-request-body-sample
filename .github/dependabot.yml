version: 2
updates:
  # Gradle dependencies (build.gradle) and the Gradle wrapper
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management*"
        update-types:
          - "minor"
          - "patch"
      gradle-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Spring Boot major upgrades (e.g. 4.x) need manual migration
      - dependency-name: "org.springframework.boot*"
        update-types: [ "version-update:semver-major" ]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
